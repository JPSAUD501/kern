[versions]
agp = "9.5.1"
kotlin = "2.4.21"
# CI installs this exact NDK. Native libraries are 16 KB aligned by an explicit linker
# flag (.cargo/config.toml), so this does not depend on the NDK's default.
ndk = "27.1.12297006"
android-min-sdk = "34"
android-target-sdk = "37"

activity-compose = "1.13.0"
androidx-annotation = "1.11.0"
compose-bom = "2026.09.00"
core-ktx = "1.19.1"
customview = "1.2.0"
jna = "5.19.1"
junit = "4.13.2"
test-ext-junit = "1.3.0"
test-runner = "1.7.0"
uiautomator = "2.4.1"

[libraries]
android-gradle-api = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-customview = { module = "androidx.customview:customview", version.ref = "customview" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "test-ext-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kern-rust-engine = { id = "kern.rust-engine" }
