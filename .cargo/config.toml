# Play requires native libraries to be aligned to 16 KB pages (decision D7).
# NDK r28+ does this by default; the flag is set explicitly so the result does
# not depend on the NDK version, and CI checks every library.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
